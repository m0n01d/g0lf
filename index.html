<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#241a33" />
    <title>g0lf</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%23fff6e6'/%3E%3Ccircle cx='12' cy='20' r='2.4' fill='%2333203a' opacity='.22'/%3E%3C/svg%3E"
    />
    <!-- iOS ignores the web app manifest's icons and display mode, so the
         home-screen behaviour has to be declared with these as well. -->
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="g0lf" />
    <script type="module" crossorigin src="/g0lf/assets/index-CLEWB2yt.js"></script>
    <link rel="stylesheet" crossorigin href="/g0lf/assets/index-1gMAS5Q2.css">
  <link rel="manifest" href="/g0lf/manifest.webmanifest"><script id="vite-plugin-pwa:register-sw" src="/g0lf/registerSW.js"></script></head>
  <body>
    <!-- Everything inside #world is positioned in fixed 1000x600 world units;
         a single scale() maps it to the viewport. That is why hole N is the
         same course on every device. -->
    <div id="stage" class="stage">
      <div id="world" class="world">
        <div class="sun"></div>

        <div id="far2" class="ridge ridge-far"></div>
        <div id="far1" class="ridge ridge-near"></div>

        <!-- The ball sits *below* the terrain layers, so anything under the
             surface is hidden for free — that is the whole sink animation. -->
        <div id="ballX" class="ball-x">
          <div id="ballY" class="ball-y">
            <div id="ball" class="ball"></div>
          </div>
        </div>

        <div id="crust" class="crust"></div>
        <div id="ground" class="ground"></div>

        <div id="shadowX" class="shadow-x"><div id="shadow" class="shadow"></div></div>

        <div id="trail" class="trail"></div>

        <div id="cup" class="cup"></div>
        <div id="flag" class="flag"><i class="pole"></i><i class="pennant"></i></div>

        <div id="aim" class="aim"></div>
      </div>
    </div>

    <div class="hud">
      <div class="chip"><b id="hudHole">1</b><small>hole</small></div>
      <div class="chip"><b id="hudStrokes">0</b><small>strokes</small></div>
      <div class="chip"><b id="hudTotal">0</b><small>total</small></div>
      <div class="chip"><b id="hudAvg">—</b><small>avg</small></div>
      <button id="cheat" class="chip chip-toggle" type="button" aria-pressed="false">
        <b>◎</b><small>trajectory</small>
      </button>
      <button id="reset" class="chip chip-toggle chip-reset" type="button" aria-pressed="false">
        new run
      </button>
    </div>

    <div id="toast" class="toast"></div>

    <!-- Every shot is compiled into this element as @keyframes, then played. -->
    <style id="shotStyle"></style>

  </body>
</html>
